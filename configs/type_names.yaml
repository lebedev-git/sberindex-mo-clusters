# Названия типов: тип получает имя и цвет по «якорному» МО (медоиду типа), а не по номеру кластера,
# поэтому подписи устойчивы к перенумерации кластеров при пересчёте.
# Названия — интерпретация профилей потребления (правило Миркина, медианы, официальные метки), а не официальная классификация.
types:
- anchor: 2584   # Чертаново Центральное (Москва)
  name: Столичные агломерации и центры с высокими тратами
  short: Столичные
  color: "#e34948"
  description: 87% типа — районы Москвы и Петербурга и города их областей; остальное — крупные центры Сибири, Урала, Дальнего Востока и Севера (Новосибирск, Екатеринбург, Красноярск, Владивосток, Хабаровск, Якутск, Мурманск). Самые высокие траты на жителя, доля общепита почти втрое выше медианы России, лучший доступ к рынкам.
- anchor: 1668   # Бузулук (Оренбургская область)
  name: Города и промышленные центры
  short: Города
  color: "#1baf7a"
  description: Региональные и промышленные города, включая большинство столиц регионов европейской части (Казань, Нижний Новгород, Самара, Уфа лежат на границе с «Столичными агломерациями»). Траты на жителя примерно на пятую часть выше медианы России, заметный общепит; здесь больше всего моногородов — около четверти типа.
- anchor: 2296   # Верхнеуральский (Челябинская область)
  name: Глубинка европейской части и Урала
  short: Глубинка
  color: "#eb6834"
  description: Районы и малые города Центра, Поволжья и Урала. Траты ниже среднего, максимальная среди типов доля маркетплейсов в безналичных тратах, летом траты, особенно в общепите, растут слабее, чем по стране.
- anchor: 1637   # Знаменский (Омская область)
  name: Аграрная периферия с летним пиком
  short: Аграрная периферия
  color: "#2a78d6"
  description: Сельские районы Поволжья, Сибири, Центра, Урала и Юга. Самые низкие траты, продукты — почти половина корзины, общепит минимален, летом траты, прежде всего в общепите, растут сильнее, чем в среднем по стране.
- anchor: 1170   # Аларский (Иркутская область)
  name: Удалённая Сибирь и горы
  short: Удалённая Сибирь
  color: "#eda100"
  description: Периферия Сибири и Дальнего Востока, Алтай, Тыва, Байкал. Высокая доля транспорта, выраженный летний пик, низкий доступ к рынкам; около 40% — районы Крайнего Севера и приравненные.
- anchor: 332    # Оймяконский (Республика Саха (Якутия))
  name: Арктика и Крайний Север
  short: Арктика
  color: "#4a3aa7"
  description: Арктические и северные районы. Высокие траты, минимальная доля маркетплейсов, сильнейшая сезонность; все МО типа — Крайний Север, две трети — Арктическая зона.
macro:
