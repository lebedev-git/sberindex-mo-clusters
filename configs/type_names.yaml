  description: Москва, Петербург, их области и крупные центры востока и севера с высокими тратами.
- anchor: 2710   # Вышневолоцкий (Тверская область)
  name: Города
  color: "#1baf7a"
  description: Региональные, промышленные и малые города.
- anchor: 1727   # Покровский (Орловская область)
  name: Сельская Россия
  color: "#2a78d6"
  description: Сельские районы европейской части, Урала, Сибири и Юга.
- anchor: 917    # Заполярный (Ненецкий автономный округ)
  name: Север
  color: "#4a3aa7"
  description: Арктика, Крайний Север и удалённые северные территории.
